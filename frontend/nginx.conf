server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index portalrh.html;

    client_max_body_size 10M;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML/JS/CSS sin build ni hash en el nombre: que el navegador revalide
    # siempre (ETag) para no quedarse con versiones viejas tras un cambio.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Rutas del bot de Telegram: solo por la red interna de Docker.
    location /api/telegram/interno/ {
        return 404;
    }

    # Ruta heredada sin prefijo /api que todavía usan algunas páginas.
    location /obtener-empleado/ {
        proxy_pass http://backend:8000/obtener-empleado/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
