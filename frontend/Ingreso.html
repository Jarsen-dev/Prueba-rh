<!DOCTYPE html>
<html lang="es">
<head>
    <script src="auth-fetch.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="access-control.js?v=20261110-restore-button"></script>
    <link rel="stylesheet" href="shared.css">
    <title>CW Connect</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        .container { width: min(96%, 1600px); max-width: 1600px; margin: 20px auto; padding: 24px; background: #1e1e1e; border-radius: 12px; box-sizing: border-box; }
        .table-container { overflow-x: auto; }
        
        table { width: 100%; min-width: 1450px; border-collapse: collapse; color: #fff; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        .col-seleccion { display: none; width: 42px; min-width: 42px; text-align: center; }
        .modo-eliminacion .col-seleccion { display: table-cell; }
        .col-nombre { min-width: 160px; }
        .col-apellido { min-width: 150px; }
        
        select, input { 
            background: #121212; color: #fff; border: 1px solid #444; 
            padding: 5px; border-radius: 4px; width: 100%; box-sizing: border-box;
        }

        .titulo-acciones {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .titulo-acciones h3 { margin-right: auto !important; }

        .btn-guardar {
            text-decoration: none;
            color: #28df50;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #28df50;
            padding: 5px 12px;
            border-radius: 5px;
            transition: 0.3s;
            background: #2c2c2c;
            text-transform: uppercase;
        }

        .btn-guardar:hover { background: #28df50; color: white;}

        .btn-eliminar {
            color: #ff7b7b;
            font-weight: bold;
            border: 1px solid #ff4b4b;
            padding: 5px 12px;
            border-radius: 5px;
            background: #2c2c2c;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-eliminar:hover { background: #ff4b4b; color: white; }

        .btn-cancelar {
            color: #ddd;
            font-weight: bold;
            border: 1px solid #888;
            padding: 5px 12px;
            border-radius: 5px;
            background: #2c2c2c;
            cursor: pointer;
            text-transform: uppercase;
        }

        .acciones-seleccion { display: flex; align-items: center; gap: 8px; }
        .acciones-seleccion[hidden] { display: none; }
        .checkbox-candidato { width: auto; transform: scale(1.15); cursor: pointer; }

        .fila-error {
            outline: 2px solid #ff4b4b;
            background: rgba(255, 75, 75, 0.08);
        }

        .fila-exito {
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .mensaje-fila-error {
            color: #ff7b7b;
            font-size: 0.82rem;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <div class="branding">
            <img src="https://lh3.googleusercontent.com/proxy/vBBsOcMFTiddXDoHaJBPaNiBJnJ9Xeohc6-T_ifx-YDkVsChrDNAsQiYxVFmEfPrhSxyMGdpJc3tdaonfxwSMRfcd6JMUfgW8ZyZQv_ZOzjFfXDIrM4xjMc" alt="Logo" class="logo">
            <h1 style="font-size: 1rem; margin: 0;">CW CONNECT</h1>
        </div>
        <nav class="nav-links">
            <a href="iniciorh.html">Inicio</a>
            <a href="Ingreso.html" class="active">Ingresos</a>
            <a href="Cheong Woon.html">Cheong Woon</a>
            <a href="Kronos.html">Kronos</a>
            <a href="InicioReclu.html">Reclutamiento</a>
        </nav>
        <div class="header-right">
            <a href="portalrh.html" class="btn-logout">Cerrar Sesión</a>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="titulo-acciones">
                <h3 style="margin: 0;">Asignación de Puesto</h3>
                <button id="btn-iniciar-eliminacion" class="btn-eliminar" type="button">Eliminar</button>
                <div id="acciones-seleccion" class="acciones-seleccion" hidden>
                    <button id="btn-eliminar-seleccionados" class="btn-eliminar" type="button">Eliminar seleccionados</button>
                    <button id="btn-cancelar-eliminacion" class="btn-cancelar" type="button">Cancelar</button>
                </div>
                <button id="btn-guardar-datos" class="btn-guardar" type="button">Guardar Datos</button>
            </div>
            <div class="table-container">
                <table id="tabla-ingresos">
                    <thead>
                        <tr style="border-bottom: 2px solid #444;">
                            <th class="col-seleccion" aria-label="Seleccionar para eliminar"></th>
                            <th class="col-nombre">Nombre Completo</th>
                            <th>Empresa</th>
                            <th>No. Empleado</th>
                            <th>Área</th>
                            <th>Puesto</th>
                            <th>Turno</th>
                            <th>Salario</th>
                            <th>Periodo de Pago</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const currentHost = window.location.hostname || '100.111.35.87';
        const PORT = '8001';
        const API_URL = `http://${currentHost}:${PORT}`;
        const API_BASES_GET = ['', API_URL, `http://localhost:${PORT}`];
        const API_BASES_ACTION = ['', API_URL, `http://localhost:${PORT}`];

        const cuerpo = document.getElementById('cuerpo-tabla');
        const btnGuardarDatos = document.getElementById('btn-guardar-datos');
        const btnIniciarEliminacion = document.getElementById('btn-iniciar-eliminacion');
        const accionesSeleccion = document.getElementById('acciones-seleccion');
        const btnEliminarSeleccionados = document.getElementById('btn-eliminar-seleccionados');
        const btnCancelarEliminacion = document.getElementById('btn-cancelar-eliminacion');
        const puestosPorArea = {
            'EPS': [
                'AYUDANTE GENERAL', 'ALMACENISTA', 'BLOCK', 'CALDERA', 'CAPTURISTA',
                'CUARTO DE SECADO', 'GERENTE', 'JEFE', 'LIDER', 'LIDER DE CUARTO DE SECADO',
                'MANTENIMIENTO', 'MOLDERO', 'MONTACARGUISTA', 'MONTADOR', 'OPERARIO',
                'PRE-EXPANSION', 'REPARACION', 'STAFF', 'SUPERVISOR', 'TECNICO', 'CORTE',
            ],
            'ASSY': [
                'AYUDANTE GENERAL', 'CHOFER', 'COMEDOR', 'INSPECTOR DE CALIDAD', 'JARDINERO',
                'LIMPIEZA', 'RECLUTAMIENTO', 'SEGURIDAD', 'SOLDADOR', 'CAPTURISTA', 'GERENTE',
                'OPERARIO', 'STAFF', 'SUPERVISOR',
            ],
            'EPS CUTTING': ['AYUDANTE GENERAL', 'GERENTE', 'MANTENIMIENTO', 'CORTE'],
            'EMBARQUE': ['AYUDANTE GENERAL', 'CAPTURISTA', 'GERENTE', 'OPERARIO', 'STAFF'],
            'MATERIAL': ['AYUDANTE GENERAL', 'GERENTE', 'STAFF', 'AYUDANTE'],
            'CALIDAD': [
                'INSPECTOR DE CALIDAD', 'OQC SISTEMA', 'CAPTURISTA', 'GERENTE',
                'JEFE', 'LIDER', 'STAFF', 'SUPERVISOR',
            ],
            'RECURSOS HUMANOS': ['GERENTE', 'STAFF', 'AYUDANTE'],
            'EPS ALMACEN': ['CAPTURISTA', 'GERENTE', 'LIDER', 'STAFF', 'AYUDANTE'],
        };

        async function getConFallback(endpoint) {
            let ultimoErrorRed = null;

            for (const baseUrl of API_BASES_GET) {
                try {
                    const respuesta = await fetch(`${baseUrl}${endpoint}`, { cache: 'no-store' });
                    const texto = await respuesta.text();
                    return { respuesta, texto };
                } catch (errorRed) {
                    ultimoErrorRed = errorRed;
                }
            }

            throw new Error(`No se pudo conectar con el servidor (${API_BASES_GET.join(' | ')}): ${ultimoErrorRed ? ultimoErrorRed.message : 'Error desconocido de red'}`);
        }

        async function postConFallback(endpoint, body) {
            let ultimoErrorRed = null;

            for (const baseUrl of API_BASES_ACTION) {
                try {
                    const respuesta = await fetch(`${baseUrl}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    const texto = await respuesta.text();
                    return { respuesta, texto };
                } catch (errorRed) {
                    ultimoErrorRed = errorRed;
                }
            }

            throw new Error(`No se pudo conectar con el servidor (${API_BASES_ACTION.join(' | ')}): ${ultimoErrorRed ? ultimoErrorRed.message : 'Error desconocido de red'}`);
        }

        async function deleteConFallback(endpoint) {
            let ultimoErrorRed = null;
            let ultimaRespuesta = null;

            for (const baseUrl of API_BASES_ACTION) {
                try {
                    const respuesta = await fetch(`${baseUrl}${endpoint}`, { method: 'DELETE' });
                    const texto = await respuesta.text();
                    if (respuesta.ok) return { respuesta, texto };
                    ultimaRespuesta = { respuesta, texto };
                } catch (errorRed) {
                    ultimoErrorRed = errorRed;
                }
            }

            if (ultimaRespuesta) return ultimaRespuesta;

            throw new Error(`No se pudo conectar con el servidor (${API_BASES_ACTION.join(' | ')}): ${ultimoErrorRed ? ultimoErrorRed.message : 'Error desconocido de red'}`);
        }

        function obtenerNumeroTemporal(nombre) {
            try {
                const tempIds = JSON.parse(localStorage.getItem('rh_temp_employee_ids') || '{}');
                return tempIds[String(nombre || '').trim().toLocaleLowerCase()] || '';
            } catch (_) {
                return '';
            }
        }

        function obtenerNombreVisible(candidato) {
            return String(
                candidato.nombre_completo
                || candidato.nombre_candidato
                || [candidato.nombre, candidato.apellido_paterno, candidato.apellido_materno]
                    .filter(Boolean)
                    .join(' ')
                || ''
            ).trim();
        }

        function normalizarNumeroTemporal(valor) {
            const texto = String(valor || '').trim();
            if (!texto) return '';
            return /^TEMP\s*-/i.test(texto) ? texto.replace(/^TEMP\s*-\s*/i, 'TEMP - ') : `TEMP - ${texto}`;
        }

        function escaparHtml(valor) {
            return String(valor || '').replace(/[&<>"']/g, (caracter) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            })[caracter]);
        }

        function filaTemplate(candidato) {
            const nombreVisible = obtenerNombreVisible(candidato);
            const tempId = normalizarNumeroTemporal(candidato.numero_temporal)
                || obtenerNumeroTemporal(nombreVisible);
            return `
                <tr data-id="${escaparHtml(candidato.id)}" data-nombre-visible="${escaparHtml(nombreVisible)}">
                    <td class="col-seleccion"><input class="checkbox-candidato" type="checkbox" aria-label="Seleccionar ${escaparHtml(nombreVisible)} para eliminar"></td>
                    <td class="col-nombre">${escaparHtml(nombreVisible)}</td>
                    <td>
                        <select class="campo-empresa" required>
                            <option value="" selected>Selecciona la opcion</option>
                            <option value="CHEONG WOON">CHEONG WOON</option>
                            <option value="KRONOS">KRONOS</option>
                        </select>
                    </td>
                    <td><input class="campo-no-empleado" type="text" value="${escaparHtml(tempId)}" readonly required></td>
                    <td>
                        <select class="campo-area" required>
                            <option value="" selected>Selecciona la opcion</option>
                            <option value="EPS">EPS</option>
                            <option value="ASSY">ASSY</option>
                            <option value="EPS CUTTING">EPS CUTTING</option>
                            <option value="EMBARQUE">EMBARQUE</option>
                            <option value="MATERIAL">MATERIAL</option>
                            <option value="CALIDAD">CALIDAD</option>
                            <option value="RECURSOS HUMANOS">RECURSOS HUMANOS</option>
                            <option value="EPS ALMACEN">EPS ALMACEN</option>
                        </select>
                    </td>
                    <td>
                        <select class="campo-puesto" required disabled>
                            <option value="" selected>Selecciona primero el área</option>
                        </select>
                    </td>
                    <td>
                        <select class="campo-turno" required>
                            <option value="" selected>Selecciona la opcion</option>
                            <option value="DÍA">DÍA</option>
                            <option value="NOCHE">NOCHE</option>
                        </select>
                    </td>
                    <td><input class="campo-salario" type="text" required></td>
                    <td>
                        <select class="campo-pago" required>
                            <option value="" selected>Selecciona la opcion</option>
                            <option value="SEMANAL">SEMANAL</option>
                            <option value="QUINCENAL">QUINCENAL</option>
                            <option value="MENSUAL">MENSUAL</option>
                        </select>
                    </td>
                </tr>
            `;
        }

        cuerpo.addEventListener('change', (event) => {
            if (!event.target.matches('.campo-area')) return;

            const puestoSelect = event.target.closest('tr')?.querySelector('.campo-puesto');
            if (!puestoSelect) return;

            puestoSelect.replaceChildren();
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = event.target.value ? 'Selecciona un puesto' : 'Selecciona primero el área';
            placeholder.selected = true;
            puestoSelect.appendChild(placeholder);

            const puestos = puestosPorArea[event.target.value] || [];
            puestos.forEach((puesto) => {
                const option = document.createElement('option');
                option.value = puesto;
                option.textContent = puesto;
                puestoSelect.appendChild(option);
            });
            puestoSelect.disabled = puestos.length === 0;
        });

        async function cargarPendientes() {
            cuerpo.innerHTML = '<tr><td colspan="11">Cargando candidatos...</td></tr>';

            try {
                const { respuesta, texto } = await getConFallback('/api/obtener-pendientes');

                if (!respuesta.ok) {
                    alert(`Error al obtener pendientes (${respuesta.status}): ${texto || 'Sin detalle'}`);
                    cuerpo.innerHTML = '<tr><td colspan="11">No se pudieron cargar candidatos.</td></tr>';
                    return;
                }

                const candidatos = JSON.parse(texto || '[]');
                if (!Array.isArray(candidatos)) {
                    throw new Error('La respuesta del servidor no contiene una lista de candidatos.');
                }

                if (!candidatos.length) {
                    cuerpo.innerHTML = '<tr><td colspan="11">No hay candidatos pendientes.</td></tr>';
                    return;
                }

                cuerpo.innerHTML = candidatos.map(filaTemplate).join('');
            } catch (error) {
                alert('Error de conexión al cargar pendientes: ' + error.message);
                cuerpo.innerHTML = '<tr><td colspan="11">No se pudieron cargar candidatos.</td></tr>';
            }
        }

        function construirFilaPayload(tr) {
            const nombre = (tr.dataset.nombreVisible || '').trim();
            return {
                registro_id: (tr.dataset.id || '').trim(),
                nombre_candidato: nombre,
                empresa: tr.querySelector('.campo-empresa')?.value.trim() || '',
                no_empleado: tr.querySelector('.campo-no-empleado')?.value.trim() || '',
                personal: 'OPERATIVO',
                puesto: tr.querySelector('.campo-puesto')?.value.trim() || '',
                area: tr.querySelector('.campo-area')?.value.trim() || '',
                turno: tr.querySelector('.campo-turno')?.value.trim() || '',
                salario: tr.querySelector('.campo-salario')?.value.trim() || '',
                pago: tr.querySelector('.campo-pago')?.value.trim() || '',
            };
        }

        function limpiarEstadoFila(tr) {
            tr.classList.remove('fila-error');
            const marcaAnterior = tr.querySelector('.mensaje-fila-error');
            if (marcaAnterior) {
                marcaAnterior.remove();
            }
        }

        function marcarErrorFila(tr, mensaje) {
            tr.classList.add('fila-error');
            const celdaNombre = tr.querySelector('td:first-child');
            if (!celdaNombre) return;

            const aviso = document.createElement('small');
            aviso.className = 'mensaje-fila-error';
            aviso.textContent = mensaje;
            celdaNombre.appendChild(aviso);
        }

        function esFilaCompleta(fila) {
            const campos = ['nombre_candidato', 'empresa', 'no_empleado', 'puesto', 'area', 'turno', 'salario', 'pago', 'registro_id'];

            for (const campo of campos) {
                if (!String(fila[campo] || '').trim()) {
                    return false;
                }
            }
            return true;
        }

        async function guardarDatosCompletos() {
            const filasHtml = Array.from(cuerpo.querySelectorAll('tr[data-id]'));
            if (!filasHtml.length) {
                alert('No hay filas para evaluar.');
                return;
            }

            const filasCompletas = [];
            filasHtml.forEach((tr) => {
                limpiarEstadoFila(tr);
                const fila = construirFilaPayload(tr);
                if (esFilaCompleta(fila)) {
                    filasCompletas.push({ ...fila, __tr: tr });
                }
            });

            if (!filasCompletas.length) {
                alert('No hay filas completas para guardar.');
                return;
            }

            let guardadas = 0;
            let conError = 0;

            for (const fila of filasCompletas) {
                const tr = fila.__tr;
                const payload = {
                    nombre_candidato: fila.nombre_candidato,
                    empresa: fila.empresa,
                    no_empleado: fila.no_empleado,
                    personal: fila.personal,
                    puesto: fila.puesto,
                    area: fila.area,
                    turno: fila.turno,
                    salario: fila.salario,
                    pago: fila.pago,
                    registro_id: fila.registro_id,
                };

                try {
                    const { respuesta, texto } = await postConFallback('/api/guardar-ingreso', payload);
                    if (respuesta.ok && texto.startsWith('OK')) {
                        guardadas += 1;
                        tr.classList.add('fila-exito');
                        setTimeout(() => tr.remove(), 320);
                    } else {
                        conError += 1;
                        const detalle = texto || `HTTP ${respuesta.status}`;
                        marcarErrorFila(tr, `No se pudo guardar: ${detalle}`);
                    }
                } catch (errorFila) {
                    conError += 1;
                    marcarErrorFila(tr, `Error de conexión: ${errorFila.message}`);
                }
            }

            if (guardadas && !conError) {
                alert(`Se guardaron ${guardadas} fila(s) correctamente.`);
            } else if (guardadas && conError) {
                alert(`Se guardaron ${guardadas} fila(s) y ${conError} quedaron marcadas con error.`);
            } else {
                alert('No se pudo guardar ninguna fila completa. Revisa las filas marcadas en rojo.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarPendientes();
            btnGuardarDatos.addEventListener('click', guardarDatosCompletos);
            btnIniciarEliminacion.addEventListener('click', () => {
                document.getElementById('tabla-ingresos').classList.add('modo-eliminacion');
                btnIniciarEliminacion.hidden = true;
                accionesSeleccion.hidden = false;
            });
            btnCancelarEliminacion.addEventListener('click', cancelarEliminacion);
            btnEliminarSeleccionados.addEventListener('click', eliminarSeleccionados);
        });

        function cancelarEliminacion() {
            cuerpo.querySelectorAll('.checkbox-candidato').forEach((checkbox) => {
                checkbox.checked = false;
            });
            document.getElementById('tabla-ingresos').classList.remove('modo-eliminacion');
            accionesSeleccion.hidden = true;
            btnIniciarEliminacion.hidden = false;
        }

        async function eliminarSeleccionados() {
            const seleccionadas = Array.from(cuerpo.querySelectorAll('tr[data-id]'))
                .filter((tr) => tr.querySelector('.checkbox-candidato')?.checked);
            if (!seleccionadas.length) {
                alert('Selecciona al menos un registro para eliminar.');
                return;
            }

            const nombres = seleccionadas.map((tr) => tr.dataset.nombreVisible || 'registro');
            const resumen = nombres.length <= 3
                ? nombres.join(', ')
                : `${nombres.slice(0, 3).join(', ')} y ${nombres.length - 3} más`;
            if (!window.confirm(`Se eliminarán definitivamente ${seleccionadas.length} registro(s): ${resumen}. ¿Deseas continuar?`)) return;

            btnEliminarSeleccionados.disabled = true;
            let eliminados = 0;
            const errores = [];
            try {
                for (const tr of seleccionadas) {
                    const id = tr.dataset.id;
                    if (!id) {
                        errores.push('Un registro no tiene un ID válido.');
                        continue;
                    }

                    try {
                        const { respuesta, texto } = await deleteConFallback(`/api/eliminar-pendiente/${encodeURIComponent(id)}`);
                        if (!respuesta.ok) {
                            errores.push(`${tr.dataset.nombreVisible || id}: ${texto || `HTTP ${respuesta.status}`}`);
                            continue;
                        }
                        tr.remove();
                        eliminados += 1;
                    } catch (error) {
                        errores.push(`${tr.dataset.nombreVisible || id}: ${error.message}`);
                    }
                }
            } finally {
                btnEliminarSeleccionados.disabled = false;
            }

            if (errores.length) {
                alert(`Se eliminaron ${eliminados} registro(s). No se pudieron eliminar ${errores.length}:\n${errores.join('\n')}`);
            } else {
                alert(`Se eliminaron ${eliminados} registro(s) correctamente.`);
                cancelarEliminacion();
            }
        }

        cuerpo.addEventListener('change', (event) => {
            const empresa = event.target.closest('.campo-empresa');
            if (!empresa) return;
            const fila = empresa.closest('tr');
            const numeroEmpleado = fila && fila.querySelector('.campo-no-empleado');
            if (numeroEmpleado) numeroEmpleado.readOnly = false;
        });
    </script>
</body>
</html>
